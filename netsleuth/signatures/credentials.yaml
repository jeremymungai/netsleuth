# Cleartext credential and secret-material patterns (defensive: these
# fire on captures you already control — exposed secrets in your traffic).
#
# Note on quoting: patterns avoid literal quote characters (regex \x27 /
# \x22 stand in) so the YAML stays single-quoted and copy-paste safe.

rules:
  - id: creds.password-assignment
    kind: password
    pattern: '(?i)\b(?:password|passwd|pwd)\b\s*[:=]\s*[\x22\x27]?([!-~]{4,64})[\x22\x27]?'
    confidence: medium
    score: 80

  - id: creds.http-form-password
    kind: password
    pattern: '(?i)(?:^|[?&])pass(?:word|wd)?=([^&\s\x22\x27]{4,64})'
    confidence: high
    score: 85

  - id: creds.aws-access-key
    kind: api-key
    pattern: '\bAKIA[0-9A-Z]{16}\b'
    confidence: high
    score: 95

  - id: creds.google-api-key
    kind: api-key
    pattern: '\bAIza[0-9A-Za-z_\-]{35}\b'
    confidence: high
    score: 90

  - id: creds.slack-token
    kind: token
    pattern: '\bxox[baprs]-[0-9A-Za-z\-]{10,}\b'
    confidence: high
    score: 90

  - id: creds.github-token
    kind: token
    pattern: '\bgh[pousr]_[0-9A-Za-z]{36,255}\b'
    confidence: high
    score: 90

  - id: creds.jwt
    kind: token
    pattern: '\beyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}\b'
    confidence: medium
    score: 75

  - id: creds.private-key-block
    kind: key-material
    pattern: '-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----'
    confidence: high
    score: 100

  - id: creds.connection-string
    kind: credential-uri
    pattern: '\b(?:mysql|postgres(?:ql)?|mongodb(?:\+srv)?|redis|amqp|ftp)://[^\s:@/]+:[^\s@/]+@[!-~]{3,120}'
    confidence: high
    score: 90

  - id: creds.basic-auth-header
    kind: auth-header
    pattern: '(?i)\bauthorization:\s*basic\s+([A-Za-z0-9+/=]{8,})'
    confidence: high
    score: 70

  - id: creds.session-cookie
    kind: session-id
    pattern: '\b(?:PHPSESSID|JSESSIONID|ASP\.NET_SessionId|sessionid|sid)=([A-Za-z0-9,\-_]{16,64})\b'
    confidence: low
    score: 40
