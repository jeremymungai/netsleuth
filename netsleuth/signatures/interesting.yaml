# "Interesting data" patterns: not secrets, but the strings an analyst
# (or CTF player) usually wants surfaced and ranked.

rules:
  - id: interesting.email
    kind: email
    pattern: '\b[A-Za-z0-9._%+\-]{2,64}@[A-Za-z0-9.\-]{3,64}\.[A-Za-z]{2,10}\b'
    confidence: medium
    score: 30

  - id: interesting.url-with-creds
    kind: url
    pattern: '\bhttps?://[^\s:@/]+:[^\s@/]+@[!-~]{4,120}'
    confidence: medium
    score: 60

  - id: interesting.url
    kind: url
    pattern: '\bhttps?://[!-~]{6,180}'
    confidence: low
    score: 15

  - id: interesting.bitcoin
    kind: cryptocurrency
    pattern: '\b(?:bc1[a-z0-9]{20,60}|[13][a-km-zA-HJ-NP-Z1-9]{25,34})\b'
    confidence: low
    score: 45

  - id: interesting.shell-command
    kind: command
    pattern: '(?i)\b(?:curl|wget|nc|ncat|bash -i|sh -i|powershell -enc|certutil -urlcache|chmod \+x)\b[!-~]{0,120}'
    confidence: medium
    score: 55

  - id: interesting.env-var-secret
    kind: env-secret
    pattern: '\b(?:SECRET|TOKEN|API_KEY|APIKEY|PASSWORD|PASSWD|PRIVATE)[A-Z_]*\s*=\s*[!-~]{6,}'
    confidence: medium
    score: 50

  - id: interesting.internal-ip
    kind: ip
    pattern: '\b(?:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})\b'
    confidence: low
    score: 8
