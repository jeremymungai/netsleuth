name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e .[dev]
      - name: Test
        run: python -m pytest --tb=short
      - name: Smoke-test CLI on the demo capture
        shell: bash
        env:
          PYTHONIOENCODING: utf8
        run: |
          python examples/generate_demo.py examples/demo.pcap
          python -m netsleuth summary examples/demo.pcap
          python -m netsleuth detect examples/demo.pcap --json > /dev/null
          python -m netsleuth ctf   examples/demo.pcap --reveal > /tmp/ctf.txt
          grep -q picoCTF /tmp/ctf.txt
          python examples/generate_covert.py examples/covert.pcap
          python -m netsleuth covert examples/covert.pcap --json > /tmp/covert.json
          grep -q v3rsion_s3l3ction /tmp/covert.json
          python -m netsleuth report examples/demo.pcap --format md --output /tmp/r.md
          test -s /tmp/r.md

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e .
      - name: Compile-check every module
        run: python -m compileall netsleuth tests scripts
      - name: Rule files parse
        run: python -c "from netsleuth import rules; r = rules.load_rules(); assert len(r) > 20, r"
